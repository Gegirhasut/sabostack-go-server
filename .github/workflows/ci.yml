name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit (the tag is in the comment), so a moved or
# compromised tag cannot change what runs here. Dependabot keeps the pins current.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", stable] # the minimum from go.mod, and the current release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      # Twice: the concurrency and cluster tests are timing-sensitive, a flake should
      # show up here rather than on somebody else's machine.
      - run: go test -race -count=2 ./...

  # The same store, cluster and server tests against a real Redis instead of miniredis:
  # ownership, adoption and matchmaking live in Lua scripts, and miniredis does not
  # reproduce real Redis everywhere (this job found a bug the fake hid). Packages run one
  # at a time (-p 1) because each test flushes the shared server.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SABO_TEST_REDIS: localhost:6379/15 # a database of its own: every test flushes it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go test -race -p 1 -count=2 ./internal/store ./internal/cluster ./internal/server ./internal/match

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^FuzzDecodeState$' -fuzztime 30s ./internal/wire
      - run: go test -run '^$' -fuzz '^FuzzDecodeClient$' -fuzztime 30s ./internal/wire

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t sabostack-go-server .
      - name: smoke test
        run: |
          docker run -d --name srv -p 8080:8080 sabostack-go-server
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs srv; exit 1
