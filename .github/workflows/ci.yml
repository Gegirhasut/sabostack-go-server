name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-ed:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", stable] # the minimum from go.mod, and the current release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # Twice: the concurrency and cluster tests are timing-sensitive, a flake should
      # show up here rather than on a reviewer's machine.
      - run: go test -race -count=2 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^FuzzDecodeState$' -fuzztime 30s ./internal/wire
      - run: go test -run '^$' -fuzz '^FuzzDecodeClient$' -fuzztime 30s ./internal/wire

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sabostack-go-server .
      - name: smoke test
        run: |
          docker run -d --name srv -p 8080:8080 sabostack-go-server
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs srv; exit 1
